<script>
(function (g) {
  'use strict';

  var LAMP_RL = 4.5;

  function I_of(E, r, R) { return E / (R + r); }
  function U_ext(E, r, R) { return I_of(E, r, R) * R; }
  function U_int(E, r, R) { return I_of(E, r, R) * r; }
  function P_out(E, r, R) { var i = I_of(E, r, R); return i * i * R; }
  function P_all(E, r, R) { return E * I_of(E, r, R); }
  function P_heat(E, r, R) { var i = I_of(E, r, R); return i * i * r; }
  function eta(E, r, R) { return R / (R + r); }
  function I_sc(E, r) { return E / r; }
  function R_of_I(E, r, i) { return i <= 1e-9 ? Infinity : E / i - r; }
  function P_max(E, r) { return E * E / (4 * r); }

  function circuit(E, r, R) {
    var i = I_of(E, r, R);
    return {
      I: i, U: i * R, Ui: i * r, E: E, r: r, R: R,
      Pout: i * i * R, Pall: E * i, Pheat: i * i * r,
      eta: R / (R + r), Isc: E / r, sum: i * R + i * r
    };
  }

  function lamps(E, r, n, RL) {
    RL = RL || LAMP_RL;
    var Rext = RL / n;
    var It = E / (Rext + r);
    var IL = It / n;
    return {
      n: n, RL: RL, Rext: Rext, It: It, IL: IL, U: It * Rext,
      PL: IL * IL * RL, P1: (function () { var i1 = E / (RL + r); return i1 * i1 * RL; })()
    };
  }

  function energy(E, r, R, t) {
    var i = I_of(E, r, R);
    return { I: i, W: E * i * t, Qo: i * i * R * t, Qi: i * i * r * t, t: t };
  }

  function emfWork(E, q) { return E * q; }

  function runSelfTest() {
    var cases = [], fail = 0;
    function ck(name, got, want, tol) {
      tol = tol == null ? 1e-9 : tol;
      var ok = Math.abs(got - want) <= tol * Math.max(1, Math.abs(want));
      if (!ok) fail++;
      cases.push({ name: name, got: got, want: want, ok: ok });
    }
    var c = circuit(6, 1.5, 4.5);
    ck('I = E/(R+r)', c.I, 1);
    ck('U外 = IR', c.U, 4.5);
    ck('U内 = Ir', c.Ui, 1.5);
    ck('U外+U内 = E', c.sum, 6);
    ck('P出 = I²R', c.Pout, 4.5);
    ck('P总 = EI', c.Pall, 6);
    ck('P内 = I²r', c.Pheat, 1.5);
    ck('效率 η = R/(R+r)', c.eta, 0.75);
    ck('短路电流 Isc = E/r', c.Isc, 4);
    ck('短路 R=0 → I = Isc', I_of(6, 1.5, 0), 4);
    ck('短路 R=0 → U = 0', U_ext(6, 1.5, 0), 0);
    ck('断路 R=1e9 → U = E', U_ext(6, 1.5, 1e9), 6, 1e-6);
    ck('断路 R=1e9 → I = 0', I_of(6, 1.5, 1e9), 0, 1e-6);
    ck('P出最大 = E²/4r', P_max(6, 1.5), 6);
    ck('R = r 时 P出 = Pmax', P_out(6, 1.5, 1.5), 6);
    ck('R = r 时 η = 0.5', eta(6, 1.5, 1.5), 0.5);
    ck('R=2r 时 P出小于最大', P_out(6, 1.5, 3) < P_max(6, 1.5) ? 1 : 0, 1);
    ck('R=0.5r 时 P出小于最大', P_out(6, 1.5, 0.75) < P_max(6, 1.5) ? 1 : 0, 1);
    ck('反算 R = E/I − r', R_of_I(6, 1.5, 1), 4.5);
    ck('电动势做功 W = Eq', emfWork(6, 3), 18);
    ck('W/q 与 q 无关', emfWork(6, 3) / 3, emfWork(6, 5) / 5);

    var l1 = lamps(6, 1.5, 1), l3 = lamps(6, 1.5, 3);
    ck('1 盏：干路 I', l1.It, 1);
    ck('1 盏：每盏 P', l1.PL, 4.5);
    ck('3 盏：外阻 R/3', l3.Rext, 1.5);
    ck('3 盏：干路 I', l3.It, 2);
    ck('3 盏：每盏 I', l3.IL, 2 / 3);
    ck('3 盏：每盏 P', l3.PL, 2);
    ck('并联越多每盏越暗', l3.PL < l1.PL ? 1 : 0, 1);

    var e = energy(6, 1.5, 4.5, 10);
    ck('三笔账 W = EIt', e.W, 60);
    ck('三笔账 Q外 = I²Rt', e.Qo, 45);
    ck('三笔账 Q内 = I²rt', e.Qi, 15);
    ck('三笔账 W = Q外 + Q内', e.W - e.Qo - e.Qi, 0);
    ck('t = 0 时三者全为 0', energy(6, 1.5, 4.5, 0).W, 0);

    return { pass: fail === 0, failed: fail, total: cases.length, cases: cases };
  }

  g.PHY = {
    LAMP_RL: LAMP_RL,
    I: I_of, Uext: U_ext, Uint: U_int, Pout: P_out, Pall: P_all, Pheat: P_heat,
    eta: eta, Isc: I_sc, RofI: R_of_I, Pmax: P_max,
    circuit: circuit, lamps: lamps, energy: energy, emfWork: emfWork,
    runSelfTest: runSelfTest
  };
})(window);
</script>
<script>

(function (g) {
  'use strict';

  var W = 1600, H = 1000;

  var GEO = { wires: [], terms: [], bodies: [] };
  function geoReset() { GEO = { wires: [], terms: [], bodies: [] }; }
  function geoTerm(x, y) { GEO.terms.push([x, y]); return [x, y]; }
  function geoBody(b) { GEO.bodies.push(b); }

  var C = {
    bg: '#000000', wire: '#E6E6E6', metal: '#9C9C9C', dim: '#6E6E6E', deep: '#3E3E3E',
    pos: '#E06A96', posL: '#F4A8C6', neg: '#0E8A96', negL: '#33C2DC',
    gold: '#F0AC5F', goldL: '#FFD08A', cyan: '#05E8FD', red: '#FC6255',
    white: '#FFFFFF', sub: '#B0B0B0'
  };

  function rrect(ctx, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function line(ctx, x1, y1, x2, y2, color, w, dash) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w || 2; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }
  function poly(ctx, pts, color, w, dash) {
    GEO.wires.push(pts.map(function (p) { return [p[0], p[1]]; }));
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w || 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) { if (i) ctx.lineTo(pts[i][0], pts[i][1]); else ctx.moveTo(pts[i][0], pts[i][1]); }
    ctx.stroke();
    ctx.restore();
  }
  function txt(ctx, x, y, s, color, size, weight, align) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = (weight || 400) + ' ' + (size || 18) + 'px "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
    ctx.restore();
  }
  function mono(ctx, x, y, s, color, size, weight, align) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = (weight || 700) + ' ' + (size || 22) + 'px "Courier New",monospace';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
    ctx.restore();
  }
  function dot(ctx, x, y, r, color, blur) {
    ctx.save();
    if (blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function arrow(ctx, x1, y1, x2, y2, color, w, head) {
    head = head || 14;
    var a = Math.atan2(y2 - y1, x2 - x1);
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w || 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * head * 0.8, y2 - Math.sin(a) * head * 0.8); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - head * Math.cos(a - 0.4), y2 - head * Math.sin(a - 0.4));
    ctx.lineTo(x2 - head * Math.cos(a + 0.4), y2 - head * Math.sin(a + 0.4));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function segs(pts) {
    var out = [], L = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      var d = Math.sqrt(dx * dx + dy * dy);
      out.push({ x0: pts[i - 1][0], y0: pts[i - 1][1], dx: dx, dy: dy, d: d, s: L });
      L += d;
    }
    return { seg: out, len: L };
  }
  function at(pts, d) {
    var s = segs(pts), i, q;
    for (i = 0; i < s.seg.length; i++) {
      q = s.seg[i];
      if (d <= q.s + q.d) { var k = (d - q.s) / (q.d || 1); return [q.x0 + q.dx * k, q.y0 + q.dy * k]; }
    }
    q = s.seg[s.seg.length - 1];
    return [q.x0 + q.dx, q.y0 + q.dy];
  }
  function flow(ctx, pts, phase, color, gap, r) {
    var s = segs(pts), L = s.len;
    var off = ((phase * 60) % gap + gap) % gap;
    for (var d = off; d < L - 10; d += gap) {
      var p = at(pts, d);
      dot(ctx, p[0], p[1], r || 4.6, color, 9);
    }
  }

  function batteryV(ctx, x, y, label, emf, sub) {
    geoTerm(x, y - 74); geoTerm(x, y + 70);
    geoBody({ type: 'rect', x: x - 36, y: y - 28, w: 72, h: 52 });
    line(ctx, x, y - 74, x, y - 26, C.wire, 3.2);
    line(ctx, x, y + 22, x, y + 70, C.wire, 3.2);
    line(ctx, x - 34, y - 26, x + 34, y - 26, C.pos, 6);
    line(ctx, x - 19, y + 22, x + 19, y + 22, C.neg, 6);
    txt(ctx, x + 46, y - 28, '+', C.pos, 20, 700);
    txt(ctx, x + 46, y + 24, '−', C.neg, 20, 700);
    if (label) txt(ctx, x - 50, y - 4, label, C.sub, 16, 600, 'right');
    if (emf != null) txt(ctx, x + 48, y - 4, emf, C.white, 16, 700, 'left');
    if (sub) txt(ctx, x - 50, y + 30, sub, C.dim, 14, 400, 'right');
  }

  function batteryPic(ctx, x, y, label, emf) {
    line(ctx, x, y - 74, x, y - 26, C.wire, 3.2);
    line(ctx, x, y + 22, x, y + 70, C.wire, 3.2);
    line(ctx, x - 34, y - 26, x + 34, y - 26, C.pos, 6);
    line(ctx, x - 19, y + 22, x + 19, y + 22, C.neg, 6);
    txt(ctx, x + 46, y - 28, '+', C.pos, 20, 700);
    txt(ctx, x + 46, y + 24, '−', C.neg, 20, 700);
    if (label) txt(ctx, x - 50, y - 4, label, C.sub, 16, 600, 'right');
    if (emf != null) txt(ctx, x + 48, y - 4, emf, C.white, 16, 700, 'left');
  }

  function resistorV(ctx, x, y, h, label, color) {
    var w = 46;
    geoTerm(x, y - h / 2); geoTerm(x, y + h / 2);
    geoBody({ type: 'rect', x: x - w / 2, y: y - h / 2, w: w, h: h });
    ctx.save();
    ctx.fillStyle = '#0a0a0a'; ctx.strokeStyle = color || C.wire; ctx.lineWidth = 2.8;
    rrect(ctx, x - w / 2, y - h / 2, w, h, 6); ctx.fill(); ctx.stroke();
    ctx.restore();
    if (label) txt(ctx, x + 34, y, label, C.sub, 16, 600, 'left');
  }
  function resistorH(ctx, x, y, w, label, color) {
    var h = 44;
    geoTerm(x - w / 2, y); geoTerm(x + w / 2, y);
    geoBody({ type: 'rect', x: x - w / 2, y: y - h / 2, w: w, h: h });
    ctx.save();
    ctx.fillStyle = '#0a0a0a'; ctx.strokeStyle = color || C.wire; ctx.lineWidth = 2.8;
    rrect(ctx, x - w / 2, y - h / 2, w, h, 6); ctx.fill(); ctx.stroke();
    ctx.restore();
    if (label) txt(ctx, x, y - h / 2 - 20, label, C.sub, 16, 600, 'center');
  }

  function lamp(ctx, x, y, r, P, P0, name) {
    geoTerm(x, y - r); geoTerm(x, y + r);
    geoBody({ type: 'circle', x: x, y: y, r: r });
    var k = Math.max(0, Math.min(1.25, P / (P0 || 4.5)));
    var a = Math.min(0.92, 0.05 + 0.9 * k);
    ctx.save();
    var RR = r * (2.4 + 1.9 * k);
    var gd = ctx.createRadialGradient(x, y, r * 0.15, x, y, RR);
    gd.addColorStop(0, 'rgba(240,172,95,' + (0.6 * a).toFixed(3) + ')');
    gd.addColorStop(1, 'rgba(240,172,95,0)');
    ctx.fillStyle = gd;
    ctx.beginPath(); ctx.arc(x, y, RR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = k > 0.3 ? C.gold : C.metal;
    ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    var q = r * 0.7;
    ctx.beginPath();
    ctx.moveTo(x - q, y - q); ctx.lineTo(x + q, y + q);
    ctx.moveTo(x + q, y - q); ctx.lineTo(x - q, y + q);
    ctx.strokeStyle = k > 0.3 ? C.goldL : C.dim;
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.restore();
    if (name) txt(ctx, x, y + r + 30, name, C.sub, 15, 600, 'center');
  }

  function meterCircle(ctx, x, y, r, letter, color) {
    geoTerm(x, y - r); geoTerm(x, y + r);
    geoBody({ type: 'circle', x: x, y: y, r: r });
    ctx.save();
    ctx.fillStyle = '#0A0A0A'; ctx.strokeStyle = color || C.wire; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
    txt(ctx, x, y + 1, letter, color || C.white, r * 0.95, 700, 'center');
  }
  function axis(ctx, x0, y0, x1, y1, xlab, ylab) {
    arrow(ctx, x0, y0, x1, y0, C.metal, 2, 12);
    arrow(ctx, x0, y0, x0, y1, C.metal, 2, 12);
    if (xlab) txt(ctx, x1 - 4, y0 + 30, xlab, C.sub, 16, 600, 'right');
    if (ylab) txt(ctx, x0 - 16, y1 + 8, ylab, C.sub, 16, 600, 'left');
  }
  function grid(ctx, x0, y0, x1, y1, nx, ny) {
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.075)'; ctx.lineWidth = 1;
    var i, x, y;
    for (i = 1; i < nx; i++) { x = x0 + (x1 - x0) * i / nx; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke(); }
    for (i = 1; i < ny; i++) { y = y0 + (y1 - y0) * i / ny; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
    ctx.restore();
  }
  function cap(ctx, x, y, s, color, size, align, weight) {
    txt(ctx, x, y, s, color || C.sub, size || 16, weight || 400, align);
  }
  function fmt(v, n) {
    if (!isFinite(v)) return '∞';
    if (Math.abs(v) >= 10000) return (v / 1000).toFixed(0) + 'k';
    if (Math.abs(v) >= 1000) return (v / 1000).toFixed(1) + 'k';
    return v.toFixed(n == null ? 2 : n);
  }

  function meterH(ctx, x, y, r, letter, color) {
    geoTerm(x - r, y); geoTerm(x + r, y);
    geoBody({ type: 'circle', x: x, y: y, r: r });
    ctx.save();
    ctx.fillStyle = '#0A0A0A'; ctx.strokeStyle = color || C.wire; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
    txt(ctx, x, y + 1, letter, color || C.white, r * 0.95, 700, 'center');
  }

  function switchH(ctx, x0, x1, y, closed, name) {
    geoTerm(x0, y); geoTerm(x1, y);
    geoBody({ type: 'rect', x: x0, y: y - 46, w: x1 - x0, h: 60 });
    line(ctx, x0, y, x0 + (x1 - x0) * 0.18, y, C.wire, 3.6);
    line(ctx, x1 - (x1 - x0) * 0.18, y, x1, y, C.wire, 3.6);
    ctx.save();
    ctx.strokeStyle = C.wire; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
    ctx.beginPath();
    if (closed) { ctx.moveTo(x0 + (x1 - x0) * 0.18, y); ctx.lineTo(x1 - (x1 - x0) * 0.18, y); }
    else { ctx.moveTo(x0 + (x1 - x0) * 0.18, y); ctx.lineTo(x1 - (x1 - x0) * 0.10, y - 44); }
    ctx.stroke();
    ctx.restore();
    dot(ctx, x0 + (x1 - x0) * 0.18, y, 5, C.wire);
    dot(ctx, x1 - (x1 - x0) * 0.18, y, 5, C.wire);
    if (name) txt(ctx, (x0 + x1) / 2, y - 66, name, C.sub, 15, 700, 'center');
  }

  function curve(ctx, pts, color, w, dash) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w || 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) { if (i) ctx.lineTo(pts[i][0], pts[i][1]); else ctx.moveTo(pts[i][0], pts[i][1]); }
    ctx.stroke();
    ctx.restore();
  }

  function wire(ctx, a, b, w) {
    poly(ctx, [a, b], C.wire, w || 3.6);
  }

  g.RENDER = { W: W, H: H, C: C, fmt: fmt, panel: null, scenes: {} };
  g.RENDER.geo = { reset: geoReset, data: function () { return GEO; } };
  g.RENDER.U = {
    rrect: rrect, line: line, poly: poly, txt: txt, mono: mono, dot: dot, arrow: arrow,
    flow: flow, batteryV: batteryV, resistorV: resistorV, resistorH: resistorH, lamp: lamp,
    meterCircle: meterCircle, meterH: meterH, switchH: switchH, wire: wire, curve: curve, batteryPic: batteryPic,
    axis: axis, grid: grid, cap: cap
  };
})(window);
</script>
<script>

(function (g) {
  'use strict';
  var U = g.RENDER.U, C = g.RENDER.C, P = g.PHY, F = g.RENDER.fmt;

  function title(ctx, t, sub) {
    U.txt(ctx, 60, 56, t, C.white, 27, 700);
    if (sub) U.txt(ctx, 60, 100, sub, C.sub, 17, 400);
  }
  function panel(o) { g.RENDER.panel = o; }

  var K = {
    bat: function (ctx, x, y, label, emf, sub) {
      U.batteryV(ctx, x, y, label, emf, sub);
      return { t: [x, y - 74], b: [x, y + 70] };
    },
    res: function (ctx, x, y, h, label, color) {
      U.resistorV(ctx, x, y, h, label, color);
      return { t: [x, y - h / 2], b: [x, y + h / 2] };
    },
    lamp: function (ctx, x, y, r, P, P0, name) {
      U.lamp(ctx, x, y, r, P, P0, name);
      return { t: [x, y - r], b: [x, y + r] };
    },
    meterV: function (ctx, x, y, r, letter, color) {
      U.meterCircle(ctx, x, y, r, letter, color);
      return { t: [x, y - r], b: [x, y + r] };
    },
    meterH: function (ctx, x, y, r, letter, color) {
      U.meterH(ctx, x, y, r, letter, color);
      return { l: [x - r, y], r: [x + r, y] };
    },
    sw: function (ctx, x0, x1, y, closed, name) {
      U.switchH(ctx, x0, x1, y, closed, name);
      return { l: [x0, y], r: [x1, y] };
    },

    w: function (ctx, a, b, w) { U.poly(ctx, [a, b], C.wire, w || 3.6); }
  };
  function tag(ctx, x, y, s, color) {
    U.txt(ctx, x, y, s, color || C.dim, 15, 600);
  }

  function s1(ctx, st) {
    var n = st.n, L = P.lamps(6, 1.5, n, 4.5);
    title(ctx, '多接一盏灯，为什么每盏都变暗？', '规格相同的灯并联在同一个电池上 —— 只是灯多了几盏');

    var bx = 230, by = 560, top = 350, bot = 790;
    var x0 = 520, step = 210, lastX = x0 + step * (n - 1);

    var bat = K.bat(ctx, bx, by, '电池', 'E = 6 V', 'r = 1.5 Ω');
    K.w(ctx, [bx, top], bat.t);
    K.w(ctx, [bx, bot], bat.b);
    K.w(ctx, [bx, top], [lastX, top]);
    K.w(ctx, [bx, bot], [lastX, bot]);

    var i, lx, lampT = [];
    for (i = 0; i < n; i++) {
      lx = x0 + step * i;
      var lp = K.lamp(ctx, lx, by, 50, L.PL, L.P1, 'L' + (i + 1));
      K.w(ctx, [lx, top], lp.t);
      K.w(ctx, [lx, bot], lp.b);
      U.mono(ctx, lx, by + 116, F(L.IL, 2) + ' A', C.sub, 18, 700, 'center');
      lampT.push(lp);
    }
    if (st.anim) {
      var sp = Math.max(.3, Math.min(1.6, L.It / 2.2));
      U.flow(ctx, [[bx, bat.t[1]], [bx, top], [lastX, top]], st.phase * sp, C.gold, 72, 5);
      U.flow(ctx, [[lastX, bot], [bx, bot], [bx, bat.b[1]]], st.phase * sp, C.gold, 72, 5);
    }

    var cx = 1270, cy = 700, barMax = 300, mx = Math.max(L.P1, L.PL) * 1.3;
    tag(ctx, cx - 30, cy - 340, '每盏的功率');
    var bars = [[L.P1, '只有一盏', C.metal, .40], [L.PL, '现在每盏', C.gold, .95]];
    for (i = 0; i < 2; i++) {
      var hh = barMax * bars[i][0] / mx;
      ctx.save();
      ctx.fillStyle = bars[i][2]; ctx.globalAlpha = bars[i][3];
      U.rrect(ctx, cx + i * 120, cy - hh, 86, hh, 6); ctx.fill();
      ctx.restore();
      U.mono(ctx, cx + i * 120 + 43, cy - hh - 26, F(bars[i][0], 2) + ' W', C.white, 18, 700, 'center');
      tag(ctx, cx + i * 120 + 43, cy + 30, bars[i][1], C.sub, 15, 400, 'center');
    }

    panel({
      kicker: '读数',
      rows: [
        ['并联的灯数 n', n + ' 盏'],
        ['干路电流 I', F(L.It, 2) + ' A'],
        ['每盏分到的电流', F(L.IL, 2) + ' A'],
        ['每盏的实际功率', F(L.PL, 2) + ' W', L.PL < L.P1 - 0.02 ? 'warn' : 'gold']
      ],
      formula: '并联越多 → R外 越小 → I 越大 → Ir 越大 → 每盏越暗',
      note: ['想一想', '灯是并联的，"互不影响"是初中的说法。', '可是每盏都暗了 —— 电池两端变"软"了。']
    });
  }

  function s2(ctx, st) {
    var rOld = st.p;
    var i1 = 1.5 / (4.5 + 0.5), P1 = i1 * i1 * 4.5;
    var r2 = 0.5 + rOld, i2 = 3.0 / (4.5 + r2), P2 = i2 * i2 * 4.5;
    title(ctx, '串一节旧电池：电动势翻倍，灯反而更暗', '旧电池的电动势一样是 1.5 V，只是内阻大得多');

    function one(cx, srcs, Pl, name, itxt, I) {
      var top = 320, bot = 760, cy = 540, lx = cx - 200, rx = cx + 200;
      K.w(ctx, [lx, top], [rx, top]);
      K.w(ctx, [lx, bot], [rx, bot]);

      var n = srcs.length, first = null, last = null, k, y, b;
      for (k = 0; k < n; k++) {
        y = cy - (n - 1) * 72 + k * 144;
        b = K.bat(ctx, lx, y, srcs[k][0], srcs[k][1], srcs[k][2]);
        if (k === 0) first = b.t;
        last = b.b;
      }
      K.w(ctx, [lx, top], first);
      K.w(ctx, [lx, bot], last);

      var lp = K.lamp(ctx, rx, cy, 50, Pl, 4.5, null);
      K.w(ctx, [rx, top], lp.t);
      K.w(ctx, [rx, bot], lp.b);

      U.txt(ctx, cx, 800, name, C.white, 20, 700, 'center');
      U.txt(ctx, cx, 838, itxt, C.sub, 16, 400, 'center');
      if (st.anim) {
        var sp = Math.max(.25, Math.min(1.3, I / 1.2));
        U.flow(ctx, [[lx, top], [rx, top]], st.phase * sp, C.gold, 66, 4.6);
        U.flow(ctx, [[rx, bot], [lx, bot]], st.phase * sp, C.gold, 66, 4.6);
      }
    }
    one(390, [['新电池', 'E = 1.5 V', 'r = 0.5 Ω']], P1, '① 一节新电池',
      'I = ' + F(i1, 2) + ' A，灯泡 ' + F(P1, 2) + ' W', i1);
    one(1170, [['新电池', 'E = 1.5 V', 'r = 0.5 Ω'], ['旧电池', 'E = 1.5 V', 'r = ' + F(rOld, 1) + ' Ω']], P2,
      '② 再串一节旧电池', 'I = ' + F(i2, 2) + ' A，灯泡 ' + F(P2, 2) + ' W', i2);

    U.txt(ctx, 780, 250, 'E 相加：1.5 + 1.5 = 3.0 V', C.sub, 18, 400, 'center');
    U.arrow(ctx, 780, 276, 780, 306, C.dim, 2, 10);
    U.txt(ctx, 780, 352, P2 < P1 ? '亮度反而更低' : '亮度略高（内阻还小）', P2 < P1 ? C.gold : C.sub, 21, 700, 'center');
    U.line(ctx, 780, 200, 780, 780, 'rgba(255,255,255,0.10)', 1, [6, 9]);

    panel({
      kicker: '读数',
      rows: [
        ['旧电池内阻 r旧', F(rOld, 1) + ' Ω'],
        ['电池组电动势 E', '3.00 V'],
        ['电池组内阻 r', F(r2, 2) + ' Ω'],
        ['灯泡实际功率', F(P2, 2) + ' W', P2 < P1 ? 'warn' : 'gold']
      ],
      formula: 'I = E /(R + r) —— 内阻变大，电流变小',
      note: ['关键', '旧电池的电动势几乎没变，变的是内阻。', '所以电压表量不出电动势。']
    });
  }

  function s3(ctx, st) {
    var s = st.p, E = 1.5, q = 3;
    title(ctx, '电源内部：静电力拦路，非静电力搬人', '把正电荷从负极搬到正极，靠的是非静电力做的功');

    var x0 = 300, x1 = 1120, yTop = 300, yBot = 810, ym = 560;
    ctx.save();
    ctx.strokeStyle = C.metal; ctx.lineWidth = 3;
    U.rrect(ctx, x0, yTop, x1 - x0, yBot - yTop, 16); ctx.stroke();
    ctx.restore();
    U.line(ctx, x0 + 44, yTop + 70, x0 + 44, yBot - 70, C.neg, 9);
    U.line(ctx, x1 - 44, yTop + 70, x1 - 44, yBot - 70, C.pos, 9);
    U.txt(ctx, x0 + 44, yBot - 34, '负极', C.negL, 18, 700, 'center');
    U.txt(ctx, x1 - 44, yBot - 34, '正极', C.posL, 18, 700, 'center');

    var i, yy;
    for (i = 0; i < 4; i++) {
      yy = yTop + 110 + i * 96;
      U.arrow(ctx, x1 - 130, yy, x0 + 170, yy, 'rgba(252,98,85,0.70)', 2.4, 13);
    }
    U.txt(ctx, (x0 + x1) / 2, yTop + 46, '内部静电场 E′（正极 → 负极）：它把正电荷往回推', C.red, 17, 600, 'center');

    var cx = x0 + 100 + (x1 - x0 - 200) * s;
    U.dot(ctx, cx, ym, 24, C.pos, 20);
    U.txt(ctx, cx, ym, '+', C.white, 24, 700, 'center');
    U.arrow(ctx, cx + 34, ym - 62, cx + 148, ym - 62, C.cyan, 4.5, 17);
    U.txt(ctx, cx + 92, ym - 96, 'F非', C.cyan, 17, 700, 'center');

    U.line(ctx, x0 + 100, ym + 100, x1 - 100, ym + 100, 'rgba(255,255,255,0.16)', 2);
    U.line(ctx, x0 + 100, ym + 100, cx, ym + 100, C.gold, 6);
    U.txt(ctx, (x0 + x1) / 2, ym + 136, '搬运进度 ' + Math.round(s * 100) + '%', C.sub, 16, 400, 'center');

    var ex = 1290, eBase = 800, eH = 400, frac = Math.max(0.02, s);
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    U.rrect(ctx, ex, eBase - eH, 100, eH, 8); ctx.fill();
    ctx.fillStyle = C.gold; ctx.globalAlpha = .92;
    U.rrect(ctx, ex, eBase - eH * frac, 100, eH * frac, 8); ctx.fill();
    ctx.restore();
    U.txt(ctx, ex + 50, eBase + 30, '电势能 Ep', C.sub, 16, 400, 'center');
    U.mono(ctx, ex + 50, eBase - eH * frac - 26, F(E * q * frac, 1) + ' J', C.goldL, 19, 700, 'center');

    panel({
      kicker: '读数',
      rows: [
        ['电动势 E', '1.50 V'],
        ['搬运的电荷 q', q + ' C'],
        ['非静电力做功 W', F(E * q * s, 1) + ' J'],
        ['电势能增加 ΔEp', F(E * q * s, 1) + ' J'],
        ['W ÷ q', F(E * s, 2) + ' V']
      ],
      formula: 'W = Eq —— 搬得越多，电势能越高',
      note: ['两个力', '静电力：正极 → 负极，把电荷往回推。', '非静电力：负极 → 正极，把电荷搬过去。']
    });
  }

  function s4(ctx, st) {
    var q = st.p;
    title(ctx, 'E = W / q：每搬 1 C 电荷能做多少功', '搬的电荷越多，做的功越多 —— 但 W/q 一直是同一个数');

    var bats = [['干电池', 1.5, 420, C.neg], ['铅蓄电池', 2.0, 980, C.pos]];
    var maxW = 2.0 * 6, i, b;
    for (i = 0; i < 2; i++) {
      b = bats[i];
      U.batteryPic(ctx, b[2], 420, b[0], 'E = ' + F(b[1], 1) + ' V');
      U.txt(ctx, b[2], 560, '每搬 1 C 做功 ' + F(b[1], 1) + ' J', C.sub, 16, 400, 'center');
      var bw = 130, bh = 380 * (b[1] * q) / maxW;
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.09)';
      U.rrect(ctx, b[2] - bw / 2, 860 - 380, bw, 380, 6); ctx.fill();
      ctx.fillStyle = b[3]; ctx.globalAlpha = .92;
      U.rrect(ctx, b[2] - bw / 2, 860 - bh, bw, bh, 6); ctx.fill();
      ctx.restore();
      U.mono(ctx, b[2], 860 - bh - 30, 'W = ' + F(b[1] * q, 1) + ' J', C.white, 20, 700, 'center');
      U.mono(ctx, b[2] + 110, 640, 'W/q = ' + F(b[1], 2) + ' V', i === 0 ? C.negL : C.posL, 21, 700, 'left');
    }
    U.txt(ctx, 700, 700, 'q', C.gold, 22, 700, 'center');
    U.txt(ctx, 700, 736, '变', C.dim, 15, 400, 'center');
    U.txt(ctx, 700, 806, 'W', C.white, 22, 700, 'center');
    U.txt(ctx, 700, 842, '变', C.dim, 15, 400, 'center');
    U.txt(ctx, 700, 906, 'W/q 不变', C.goldL, 18, 700, 'center');

    panel({
      kicker: '读数',
      rows: [
        ['搬运电荷 q', F(q, 1) + ' C'],
        ['干电池做功 W', F(1.5 * q, 1) + ' J'],
        ['干电池 W/q', '1.50 V'],
        ['蓄电池做功 W', F(2.0 * q, 1) + ' J'],
        ['蓄电池 W/q', '2.00 V']
      ],
      formula: 'E = W / q（单位 V）',
      note: ['三句话', '① E 由电源本身决定，与外电路无关；', '② 干电池的 E 与体积无关；', '③ E 不是电压，只是单位相同。']
    });
  }

  function s5(ctx, st) {
    var R = st.p, E = 6, r = 1.5, I = P.I(E, r, R), Uo = I * R, Ui = I * r;
    title(ctx, '沿电流走一圈：电势一路往下掉', '外电路降 IR，内电路降 Ir，两段加起来正好是 E');

    var bx = 210, by = 560, top = 320, bot = 800, rx = 760;
    var bat = K.bat(ctx, bx, by, '电源', 'E = 6 V', 'r = 1.5 Ω');
    var res = K.res(ctx, rx, by, 200, 'R = ' + F(R, 1) + ' Ω', C.gold);
    K.w(ctx, [bx, top], bat.t);
    K.w(ctx, [bx, bot], bat.b);
    K.w(ctx, [bx, top], [rx, top]);
    K.w(ctx, [bx, bot], [rx, bot]);
    K.w(ctx, [rx, top], res.t);
    K.w(ctx, [rx, bot], res.b);

    if (st.anim) {
      var sp = Math.max(.25, Math.min(1.6, I / 2));
      U.flow(ctx, [[bx, bat.t[1]], [bx, top], [rx, top], res.t], st.phase * sp, C.gold, 64, 4.8);
      U.flow(ctx, [[rx, bot], res.b, [bx, bot], [bx, bat.b[1]]], st.phase * sp, C.gold, 64, 4.8);
    }

    var px0 = 980, px1 = 1520, base = 830, hi = 300;

  function s6(ctx, st) {

  function s7(ctx, st) {

    for (k = 0; k <= 90; k++) {

  function s8(ctx, st) {

    if (gw * Ui / E > 90) U.txt(ctx, gx + gw * Uo / E + gw * Ui / E / 2, gy + 46, 'Ir', C.white, 18, 700, 'center');

    var ax = 990, ay = 830, aw = 520, ah = 260, Rmax = 20;
    U.axis(ctx, ax, ay, ax + aw, ay - ah + 6, 'R / Ω', 'U / V');
    var pts = [], k, rr;
    for (k = 0; k <= 90; k++) {

    });
  }

  function s9(ctx, st) {
    var E = 6, r = 1.5, Isc = E / r, I = st.p, Uo = E - I * r, R = P.RofI(E, r, I);
    title(ctx, 'U-I 图：一条直线，三个数一次读全', 'U = −rI + E 就是 y = kx + b');

  function s10(ctx, st) {
    var E = 6, r = 1.5, on = st.sw, R = on ? st.p : Infinity;

    K.w(ctx, [bx, top], bat.t);

      var res = K.res(ctx, rx, by, 200, null, on ? C.gold : C.metal);

      U.txt(ctx, rx + 34, by, on ? 'R = ' + F(R, 1) + ' Ω' : 'R = ∞（断路，不接负载）',

    if (st.anim && I > 0) {

      U.txt(ctx, tx, 512, '绝对不允许把电源两极短接！', C.red, 18, 700);

    });
  }

  function s11(ctx, st) {
    var E = 6, r = 1.5, R = st.p;

    }
    U.curve(ctx, pts, C.cyan, 3.4);
    var xm = ax + aw * r / Rmax, ym = ay - (ah - 40) * Pm / (Pm * 1.18);
    U.line(ctx, xm, ay, xm, ym, 'rgba(255,255,255,0.22)', 1.4, [6, 6]);
    U.dot(ctx, xm, ym, 9, C.gold, 12);
    U.txt(ctx, xm + 16, ym - 24, 'R = r：P出max = E²/4r = ' + F(Pm, 2) + ' W', C.goldL, 18, 700);

<script>
(function (g) {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var S = g.STEPS, R = g.RENDER;
  var cur = 0, P = {}, SW = {}, phase = 0, focus = false;
  var animOn = true, phaseFrozen = null;
  var stage = document.getElementById('stage');
  var view = document.getElementById('view');

  var narrow = false, sc = 1, cw = 1600, chh = 1000;
  function fit() {
    var W = window.innerWidth, H = window.innerHeight;
    narrow = W < 900;
    var s = narrow ? W / 1920 : Math.min(W / 1920, H / 1080);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = ((W - 1920 * s) / 2) + 'px';
    stage.style.top = (narrow ? 8 : (H - 1080 * s) / 2) + 'px';
    document.body.classList.toggle('narrow', narrow);
    var tip = document.getElementById('rotTip');
    if (tip) tip.style.display = (narrow && H > W) ? 'block' : 'none';
    resizeCanvas();
  }
  window.addEventListener('resize', fit);

  function resizeCanvas() {
    var box = view.getBoundingClientRect();
    var s = stage.getBoundingClientRect().width / 1920 || 1;
    cw = Math.max(320, Math.round(box.width / s));
    chh = Math.max(200, Math.round(box.height / s));
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(cw * dpr);
    cv.height = Math.round(chh * dpr);
    cv.style.width = cw + 'px';
    cv.style.height = chh + 'px';
    mapT();
  }

  var K = 1, OX = 0, OY = 0, DPR = 1;
  function mapT() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    K = Math.min(cw / R.W, chh / R.H);
    OX = (cw - R.W * K) / 2;
    OY = (chh - R.H * K) / 2;
    ctx.setTransform(DPR * K, 0, 0, DPR * K, DPR * OX, DPR * OY);
  }

  var toc = document.getElementById('toc');
  S.forEach(function (s, i) {
    if (i && s.act !== S[i - 1].act) {
      var sp = document.createElement('span'); sp.className = 'sep'; toc.appendChild(sp);
    }
    var b = document.createElement('button');
    b.textContent = s.nav;
    b.title = s.title;
    b.onclick = function () { go(i); };
    toc.appendChild(b);
  });

  function value() {
    var d = S[cur].p;
    if (!d) return 0;
    if (P[cur] == null) P[cur] = d.val;
    return P[cur];
  }
  function state() {
    var st = { p: value(), phase: (phaseFrozen == null ? phase : phaseFrozen), anim: animOn && !narrow };
    if (S[cur].scene === 's1') st.n = Math.round(st.p);
    if (S[cur].allow && S[cur].allow.sw) st.sw = SW[cur] !== false;
    return st;
  }

  function draw() {
    R.geo.reset();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    mapT();
    ctx.save();
    R.panel = null;
    var fn = R.scenes[S[cur].scene];
    if (fn) fn(ctx, state(), S[cur]);
    ctx.restore();
    paintPanel();
    paintBar();
  }

  function paintPanel() {
    var p = R.panel || {};
    var rows = p.rows || [];
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += '<div class="row"><span>' + r[0] + '</span><b' + (r[2] ? ' class="' + r[2] + '"' : '') + '>' + r[1] + '</b></div>';
    }
    if (p.formula) html += '<div class="fml">' + p.formula + '</div>';
    if (p.note) {
      html += '<div class="nte"><h4>' + p.note[0] + '</h4>';
      for (var j = 1; j < p.note.length; j++) html += '<p>' + p.note[j] + '</p>';
      html += '</div>';
    }
    document.getElementById('railbody').innerHTML = html;
  }

  function paintBar() {
    document.getElementById('cnt').textContent = (cur + 1) + ' / ' + S.length;
    document.getElementById('actName').textContent = S[cur].act;
    document.getElementById('hint').innerHTML = S[cur].hint;
    document.getElementById('railTitle').textContent = (R.panel && R.panel.kicker) || '读数';
    var bs = toc.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].className = (i === cur ? 'on' : '');
  }

  var rng = document.getElementById('pRange');
  var pLab = document.getElementById('pLab');
  var pVal = document.getElementById('pVal');
  var ctl = document.getElementById('ctl');
  var btnSw = document.getElementById('btnSw');

  function paintVal() {
    var d = S[cur].p; if (!d) return;
    var v = value();
    pVal.innerHTML = (d.pct ? (v * 100).toFixed(0) : v.toFixed(d.fmt)) +
      '<i>' + (d.unit || (d.pct ? '%' : '')) + '</i>';
  }
  function syncCtl() {
    var d = S[cur].p;
    if (!d) { ctl.style.display = 'none'; }
    else {
      ctl.style.display = 'flex';
      pLab.textContent = d.label;
      rng.min = d.min; rng.max = d.max; rng.step = d.step; rng.value = value();
      paintVal();
      var dis = !(S[cur].allow && S[cur].allow.p);
      rng.disabled = dis;
      ctl.classList.toggle('off', dis);
    }
    var hasSw = S[cur].allow && S[cur].allow.sw;
    btnSw.style.display = hasSw ? 'inline-block' : 'none';
    if (hasSw) {
      btnSw.className = 'mk' + (SW[cur] !== false ? ' on' : '');
      btnSw.textContent = '开关 K：' + (SW[cur] !== false ? '闭合' : '断开');

  }
  rng.addEventListener('input', function () {
    if (!S[cur].p) return;
    P[cur] = +rng.value; paintVal(); draw();
  });
  btnSw.onclick = function () { SW[cur] = SW[cur] === false ? true : false; syncCtl(); draw(); };

  function go(i) {
    cur = Math.max(0, Math.min(S.length - 1, i));
    if (P[cur] == null && S[cur].p) P[cur] = S[cur].p.val;
    if (SW[cur] == null) SW[cur] = true;
    syncCtl(); draw();
  }
  document.getElementById('btnPrev').onclick = function () { go(cur - 1); };
  document.getElementById('btnNext').onclick = function () { go(cur + 1); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(cur + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(cur - 1); e.preventDefault(); }

    if (e.key === 'Escape' && focus) setFocus(false);
  });

  function setFocus(on) {
    focus = !!on;
    document.body.classList.toggle('fs', focus);

      if (document.documentElement.requestFullscreen) {
        try { document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}

    } else if (document.fullscreenElement && document.exitFullscreen) {

  }
  document.getElementById('btnFs').onclick = function (e) { e.stopPropagation(); setFocus(!focus); };
  view.addEventListener('click', function () { if (focus) setFocus(false); });
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && focus) setFocus(false);
  });

  function wiringAudit() {
    var g2 = R.geo.data(), TOL = 3;
    var pts = [], wires = g2.wires;
    function key(p) { return Math.round(p[0] / TOL) + ',' + Math.round(p[1] / TOL); }
    function idx(p) {
      var k = key(p);
      if (!(k in pts)) pts[k] = pts.length;
      return pts[k];
    }

    var n = 0, kk;
    wires.forEach(function (wl) { wl.forEach(function (p) { idx(p); }); });
    g2.terms.forEach(function (p) { idx(p); });
    n = pts.length;
    var parent = [];
    for (var i = 0; i < n; i++) parent[i] = i;
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function uni(x, y) { x = find(x); y = find(y); if (x !== y) parent[y] = x; }
    var deg = new Array(n).fill(0);
    wires.forEach(function (wl) {
      for (var j = 1; j < wl.length; j++) { var A = idx(wl[j - 1]), B = idx(wl[j]); uni(A, B); deg[A]++; deg[B]++; }
    });
    var termSet = {};
    g2.terms.forEach(function (p) { termSet[idx(p)] = true; });

    var bad = [];

    for (kk in pts) {
      if (!(kk in pts)) continue;
      var id = pts[kk];
      if (!termSet[id] && deg[id] < 2) {
        bad.push('悬空端点 (' + Math.round(parseFloat(kk.split(',')[0]) * TOL) + ',' + Math.round(parseFloat(kk.split(',')[1]) * TOL) + ')');
      }
    }

    var wireEnds = [];
    wires.forEach(function (wl) { wireEnds.push(wl[0], wl[wl.length - 1]); });
    var idle = 0;
    g2.terms.forEach(function (t) {
      var hit = false;
      for (var i = 0; i < wireEnds.length; i++) {
        if (Math.abs(t[0] - wireEnds[i][0]) <= TOL && Math.abs(t[1] - wireEnds[i][1]) <= TOL) { hit = true; break; }
      }
      if (!hit) {

        var mate = false;
        g2.terms.forEach(function (u) {
          if (u !== t && Math.abs(u[0] - t[0]) <= TOL && Math.abs(u[1] - t[1]) <= TOL) mate = true;
        });
        if (!mate) { idle++; bad.push('元件端子 (' + Math.round(t[0]) + ',' + Math.round(t[1]) + ') 没有任何导线接着'); }
      }
    });

    var roots = {};
    wires.forEach(function (wl) { roots[find(idx(wl[0]))] = true; });
    var nRoots = Object.keys(roots).length;
    if (wires.length && nRoots > 1) bad.push('导线分成 ' + nRoots + ' 段互不相连');

    return { pass: bad.length === 0, wires: wires.length, terminals: g2.terms.length,
             idleTerminals: idle, bodies: g2.bodies.length, components: nRoots, problems: bad.slice(0, 6) };
  }

  g.__viz = {
    selfTest: function () {
      var r = g.PHY.runSelfTest();
      var bad = [];
      S.forEach(function (s) {
        var allow = s.allow || {};
        if (/拖动/.test(s.hint) && !allow.p) bad.push(s.nav + ': hint 说能拖但 allow 无 p');
        if (/开关/.test(s.hint) && !allow.sw) bad.push(s.nav + ': hint 说开关但 allow 无 sw');
        if (allow.p && !s.p) bad.push(s.nav + ': allow.p 缺 p 定义');
        if (allow.sw && !/开关/.test(s.hint)) bad.push(s.nav + ': allow.sw 但 hint 未提开关');
        if (s.p) {
          if (!(s.p.min < s.p.max)) bad.push(s.nav + ': p 区间非法');
          if (s.p.val < s.p.min || s.p.val > s.p.max) bad.push(s.nav + ': p 初值越界');
          if (!(s.p.step > 0)) bad.push(s.nav + ': p 步长非法');
        }
        if (!g.RENDER.scenes[s.scene]) bad.push(s.nav + ': 场景 ' + s.scene + ' 不存在');
      });

      var wireBad = [];

      r.interactionMismatch = bad;
      r.wiring = { pass: wireBad.length === 0, bad: wireBad };
      r.steps = S.length;
      r.pass = r.pass && bad.length === 0 && wireBad.length === 0;

    },
